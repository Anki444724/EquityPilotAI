# =============================================================================
# Local production-shaped stack.
#
#   docker compose up --build
#     api      → http://localhost:8000  (docs at /docs)
#     web      → http://localhost:3000
#     postgres, redis
#
# The point of this file is to run the deployment topology, not a convenient
# approximation of it: Postgres rather than SQLite, Redis-backed rate limiting
# rather than per-process, and the worker as its own process. Bugs that only
# appear under those conditions — a shared rate limit, a job claimed twice —
# are exactly the ones a single-process dev server hides.
# =============================================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ierp
      POSTGRES_PASSWORD: ierp_local_password
      POSTGRES_DB: ierp
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      # `pg_isready` rather than a TCP check: the port opens before the
      # database is able to answer, and dependent containers that start on the
      # port alone fail their first query.
      test: ["CMD-SHELL", "pg_isready -U ierp -d ierp"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+psycopg://ierp:ierp_local_password@postgres:5432/ierp
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_BACKEND: redis
      # Local-only values. A real deployment injects these from a secret
      # store; committing them here would be the exact mistake the AI Settings
      # sheet warns about.
      SECRET_KEY: local-development-signing-key-not-for-production-use
      ENCRYPTION_KEY: local-development-envelope-key-not-for-production
      NATIVE_AUTH: "true"
      LOG_FORMAT: json
      # The blog's own origin is listed explicitly, never a wildcard:
      # allow_credentials is on, and with credentials enabled a wildcard is
      # either rejected by the browser or — in the configurations where it is
      # honoured — an open door. An explicit origin costs one list entry.
      CORS_ORIGINS: '["https://equitypilot.in","https://www.equitypilot.in","https://equitypilot.blogspot.com"]'
      EMAIL_LINK_BASE: https://equitypilot.in
      OAUTH_REDIRECT_BASE: https://equitypilot.in
      # The API serves requests; the worker container runs the jobs.
      WORKER_ENABLED: "false"
      SCHEDULER_ENABLED: "false"
      BACKUP_DIR: /app/backups
      # Document storage, spelled out in both services that touch it. The API
      # streams an upload into DOCUMENT_STORAGE_PATH and enqueues a
      # DocumentJob; the worker later re-reads those exact bytes to parse and
      # index them. If the two services resolved this differently, the worker
      # would look for a file that exists only in the API's container.
      DOCUMENT_STORAGE_BACKEND: "local"
      DOCUMENT_STORAGE_PATH: /data/documents
      # --- Blogger ---------------------------------------------------
      # The API side of the integration: it serves the blog's public chat and
      # accepts a sync trigger. Reading the feed is the worker's job.
      BLOGGER_ENABLED: "true"
      BLOGGER_FEED_URL: https://equitypilot.blogspot.com/feeds/posts/default
      BLOGGER_MAX_POSTS: "100"
      BLOGGER_SYNC_TIMEOUT_SECONDS: "30"
      # Bound on one public chat answer. The provider chain behind it is
      # patient to a fault (3 attempts x 60s per provider, 4 providers),
      # and a blog reader behind a 60s proxy is not: retrieval and
      # grounding finish in the first second, so an unbounded generation
      # hangs the request after the work is done. Keep this under the
      # reverse proxy's read timeout; expiry returns a retryable 504.
      BLOGGER_CHAT_TIMEOUT_SECONDS: "45"
      # The only company the public chatbot will discuss. Everything else is
      # refused before it is looked up, so widening this list is a deliberate
      # editorial decision rather than a side effect of adding a document.
      BLOGGER_PUBLIC_TICKERS: SHRIRAMFIN
      # Empty by default. A real deployment injects a real value from its
      # secret store; with no value set, POST /blogger/sync is available only
      # to a signed-in operator holding document:upload.
      BLOGGER_SYNC_SECRET: ""
      # Empty by default: a post that names no company is skipped and logged,
      # never filed against a fallback. Set this only if every post on the blog
      # really is about one company.
      BLOGGER_DEFAULT_TICKER: ""
    volumes:
      - backups:/app/backups
      # The shared document store. A *named* volume rather than a bind mount
      # or the container filesystem, for two reasons: the bytes must survive
      # restarts, recreation and rebuilds, and they must be the same bytes
      # the worker sees. Without this mount each container had its own
      # ephemeral /data/documents, and every DocumentJob failed looking for
      # an object only the API could see.
      - documents:/data/documents
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: ./backend
    command: ["python", "-m", "app.worker"]
    # The backend image HEALTHCHECK curls /health/ready on :8000. That is
    # correct for the API, but this process is `python -m app.worker` and
    # does not expose an HTTP server, so the inherited check marks a
    # working job processor unhealthy. Disable here; do not weaken the API.
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+psycopg://ierp:ierp_local_password@postgres:5432/ierp
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: local-development-signing-key-not-for-production-use
      ENCRYPTION_KEY: local-development-envelope-key-not-for-production
      LOG_FORMAT: json
      BACKUP_DIR: /app/backups
      # Same storage backend and path as the api service — deliberately a
      # repeat, not a default: a drift between the two is invisible until a
      # DocumentJob fails claiming its source object. These lines and the
      # shared volume below are what keep upload and ingestion on one store.
      DOCUMENT_STORAGE_BACKEND: "local"
      DOCUMENT_STORAGE_PATH: /data/documents
      # Exactly one process in the deployment runs the scheduler; more than
      # one and every recurring job fires N times.
      SCHEDULER_ENABLED: "true"
      WORKER_ENABLED: "true"
      WORKER_CONCURRENCY: "2"
      # --- Blogger ---------------------------------------------------
      # The worker side of the integration: it runs the scheduled feed sync
      # and then the document jobs that sync enqueues. Same values as the API
      # for the settings both read, so a manual `docker compose exec worker
      # python -m app.services.blogger.sync` behaves exactly like the
      # scheduled run.
      BLOGGER_ENABLED: "true"
      BLOGGER_FEED_URL: https://equitypilot.blogspot.com/feeds/posts/default
      BLOGGER_MAX_POSTS: "100"
      BLOGGER_SYNC_TIMEOUT_SECONDS: "30"
      # Bound on one public chat answer. The provider chain behind it is
      # patient to a fault (3 attempts x 60s per provider, 4 providers),
      # and a blog reader behind a 60s proxy is not: retrieval and
      # grounding finish in the first second, so an unbounded generation
      # hangs the request after the work is done. Keep this under the
      # reverse proxy's read timeout; expiry returns a retryable 504.
      BLOGGER_CHAT_TIMEOUT_SECONDS: "45"
      BLOGGER_PUBLIC_TICKERS: SHRIRAMFIN
      BLOGGER_SYNC_SECRET: ""
      BLOGGER_DEFAULT_TICKER: ""
    volumes:
      - backups:/app/backups
      # The same named volume the api service mounts — this is the hand-off.
      # The worker claims a DocumentJob and reads the stored source from
      # /data/documents: not a copy of what the API wrote, the very bytes.
      - documents:/data/documents
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started
    restart: unless-stopped

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  backups:
  # Uploaded documents, mounted at /data/documents by BOTH api and worker.
  # A named top-level volume survives `compose restart`, container recreation
  # and image rebuilds; only an explicit `compose down -v` (or `docker volume
  # rm`) removes it. Anonymous volumes and container-local paths would not.
  documents:
